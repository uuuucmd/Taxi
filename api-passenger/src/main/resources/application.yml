server:
  port: 8081
  tomcat:
    threads:
      max: 500
      min-spare: 20
spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-passenger
  cloud:
    nacos:
      discovery:
        ip: "${NACOS_DISCOVERY_IP:127.0.0.1}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
  redis:
    host: "${REDIS_HOST:localhost}"
    port: "${REDIS_PORT:6379}"
    database: "${REDIS_DATABASE:0}"


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-}] --- [%thread] %logger{36} : %msg%n"
  level:
    root: INFO

verification-code:
  dev-mode: "${VERIFICATION_CODE_DEV_MODE:false}"

feign:
  httpclient:
    enabled: true
    max-connections: 800
    max-connections-per-route: 400
  client:
    config:
      default:
        connectTimeout: 2000
        readTimeout: 10000

