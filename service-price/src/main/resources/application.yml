spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: service-price
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SERVICE_PRICE_DB_URL:jdbc:mysql://localhost:3306/service-price?characterEncoding=utf-8&serverTimezone=GMT%2B8}"
    username: "${SERVICE_PRICE_DB_USERNAME:${DB_USERNAME:root}}"
    password: "${SERVICE_PRICE_DB_PASSWORD:${DB_PASSWORD:}}"
  cloud:
    nacos:
      discovery:
        ip: "${NACOS_DISCOVERY_IP:127.0.0.1}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
  redis:
    host: "${REDIS_HOST:localhost}"
    port: "${REDIS_PORT:6379}"
    database: "${REDIS_DATABASE:0}"
    timeout: "${REDIS_TIMEOUT:500ms}"

price:
  rule:
    cache-ttl-seconds: "${PRICE_RULE_CACHE_TTL_SECONDS:3600}"
    cache-not-exists-ttl-seconds: "${PRICE_RULE_CACHE_NOT_EXISTS_TTL_SECONDS:60}"
server:
  port: 8084
