spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-driver
  cloud:
    nacos:
      discovery:
        ip: "${NACOS_DISCOVERY_IP:127.0.0.1}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
server:
  port: 8088

verification-code:
  dev-mode: "${VERIFICATION_CODE_DEV_MODE:false}"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-}] --- [%thread] %logger{36} : %msg%n"

taxi:
  local-simulation: "${LOCAL_SIMULATION:true}"
