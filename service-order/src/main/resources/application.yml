spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: service-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SERVICE_ORDER_DB_URL:jdbc:mysql://localhost:3306/service-order?characterEncoding=utf-8&serverTimezone=GMT%2B8}"
    username: "${SERVICE_ORDER_DB_USERNAME:${DB_USERNAME:root}}"
    password: "${SERVICE_ORDER_DB_PASSWORD:${DB_PASSWORD:}}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  cloud:
    nacos:
      discovery:
        ip: "${NACOS_DISCOVERY_IP:127.0.0.1}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
  redis:
    port: "${REDIS_PORT:6379}"
    host: "${REDIS_HOST:localhost}"
    database: "${REDIS_DATABASE:0}"


amap:
  key: "${AMAP_KEY:}"
  sid: "${AMAP_SID:}"

taxi:
  local-simulation: "${LOCAL_SIMULATION:true}"

order:
  accept-timeout:
    minutes: "${ORDER_ACCEPT_TIMEOUT_MINUTES:30}"
    scan-delay-ms: "${ORDER_ACCEPT_TIMEOUT_SCAN_DELAY_MS:60000}"
  finalization:
    max-attempts: "${ORDER_FINALIZATION_MAX_ATTEMPTS:3}"
    base-retry-delay-seconds: "${ORDER_FINALIZATION_BASE_RETRY_DELAY_SECONDS:30}"
    max-retry-delay-seconds: "${ORDER_FINALIZATION_MAX_RETRY_DELAY_SECONDS:900}"
    processing-lease-seconds: "${ORDER_FINALIZATION_PROCESSING_LEASE_SECONDS:120}"
    lease-safety-margin-ms: "${ORDER_FINALIZATION_LEASE_SAFETY_MARGIN_MS:30000}"

feign:
  httpclient:
    enabled: true
    max-connections: 800
    max-connections-per-route: 400
  client:
    config:
      finalizationDriverUserClient:
        connectTimeout: "${ORDER_FINALIZATION_DRIVER_CONNECT_TIMEOUT_MS:2000}"
        readTimeout: "${ORDER_FINALIZATION_DRIVER_READ_TIMEOUT_MS:10000}"
      finalizationMapClient:
        connectTimeout: "${ORDER_FINALIZATION_MAP_CONNECT_TIMEOUT_MS:2000}"
        readTimeout: "${ORDER_FINALIZATION_MAP_READ_TIMEOUT_MS:30000}"
      finalizationPriceClient:
        connectTimeout: "${ORDER_FINALIZATION_PRICE_CONNECT_TIMEOUT_MS:2000}"
        readTimeout: "${ORDER_FINALIZATION_PRICE_READ_TIMEOUT_MS:10000}"

logging:
  level:
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [traceId=%X{traceId:-}] --- [%thread] %logger{36} : %msg%n"

---
spring:
  profiles: 8089
server:
  port: 8089
  tomcat:
    threads:
      max: 500
      min-spare: 20
---
spring:
  profiles: 8090
server:
  port: 8090
  tomcat:
    threads:
      max: 500
      min-spare: 20
