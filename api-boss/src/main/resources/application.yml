spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-boss
  cloud:
    nacos:
      discovery:
        ip: "${NACOS_DISCOVERY_IP:127.0.0.1}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
server:
  port: 8087

boss:
  admin:
    username: "${BOSS_ADMIN_USERNAME:admin}"
    password: "${BOSS_ADMIN_PASSWORD:admin123}"
