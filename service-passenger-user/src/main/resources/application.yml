server:
  port: 8083
  tomcat:
    threads:
      max: 500
      min-spare: 20

logging:
  level:
    root: INFO

spring:
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  application:
    name: service-passenger-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SERVICE_PASSENGER_USER_DB_URL:jdbc:mysql://localhost:3306/service-passenger-user?characterEncoding=utf-8&serverTimezone=GMT%2B8}"
    username: "${SERVICE_PASSENGER_USER_DB_USERNAME:${DB_USERNAME:root}}"
    password: "${SERVICE_PASSENGER_USER_DB_PASSWORD:${DB_PASSWORD:}}"
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  cloud:
    nacos:
      discovery:
        ip: "${NACOS_DISCOVERY_IP:127.0.0.1}"
        server-addr: "${NACOS_SERVER_ADDR:localhost:8848}"
        username: "${NACOS_USERNAME:nacos}"
        password: "${NACOS_PASSWORD:}"
